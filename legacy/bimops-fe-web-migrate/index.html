<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta version="<%- version %>" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="/basscss.css" />
  <script src="/config.js"></script>
  <script>
    (function () {
      try {
        var cacheText = localStorage.getItem("system-title-cache");
        var lastUserId = localStorage.getItem("lastUserId");
        if (!cacheText || !lastUserId) return;
        var cache = JSON.parse(cacheText);
        var userCache = cache && cache[lastUserId];
        if (!userCache) return;
        var lastTenantId = userCache.lastTenantId;
        var tenantInfo =
          lastTenantId && userCache.tenants ? userCache.tenants[lastTenantId] : null;
        var cachedLogo = tenantInfo && tenantInfo.logo;
        if (typeof cachedLogo === "string" && cachedLogo.trim()) {
          window.__startupTenantLogo = cachedLogo;
        }
      } catch (error) {}
    })();
  </script>
  <title></title>
  <link rel="icon" id="dynamic-favicon" href="/favicon.ico" type="image/x-icon">
  <script>
    (function () {
      var cachedLogo = window.__startupTenantLogo;
      if (typeof cachedLogo === "string" && cachedLogo.trim()) {
        var icon = document.getElementById("dynamic-favicon");
        if (icon) {
          icon.setAttribute("href", cachedLogo);
        }
      }
    })();
  </script>

</head>

<body>
  <style>
    .svg-loading{
      fill: #4096ff;
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -45%);
      width: 3vw;

  <noscript>

      We're sorry but doesn't work

  <div id="app">

        <rect x="60" width="15" height="140" rx="6">

          <animate attributeName="y" begin="0.5s" dur="1s" values="10;15;20;25;30;35;40;45;50;0;10" calcMode="linear"
