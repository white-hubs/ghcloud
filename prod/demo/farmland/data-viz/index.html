<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta version="<%- version %>" />
  <title>深圳市定制化大屏</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: inherit;
      padding: 0;
      margin: 0;
    }

    html {
      box-sizing: border-box;
      background: transparent;
    }

    body {
      font-family:'YouSheBiaoTiHei';
      background-image: url("/resource/v1/demo-farmland/background.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    iframe {
      border: 0;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
    }

    @font-face {
      font-family: 'YouSheBiaoTiHei';
      src: url("/resource/v1/fonts/you-she-biao-ti-hei.ttf")
    }

    @font-face {
        font-family: "D-DIN-PRO";
        src: url("/resource/v1/fonts/D-DIN-PRO-500-Medium.otf");
    }

    @font-face {
        font-family: "Source Han Sans CN";
        src: url("/resource/v1/fonts/SourceHanSansCN-Medium.otf");
    }
  </style>
</head>

<body>
  <div id="farmland-data-viz" style="height: 100%; width: 100%;"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
