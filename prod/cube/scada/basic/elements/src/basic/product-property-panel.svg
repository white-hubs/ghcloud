<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:scada="http://cube-scada.io/ns/v1"
     viewBox="0 0 200 120"
     width="200"
     height="120"
     preserveAspectRatio="none">
  <metadata>
    <scada:element>
      <scada:meta type="product-property-panel" label="&#x4EA7;&#x54C1;&#x5C5E;&#x6027;&#x9762;&#x677F;" category="&#x57FA;&#x7840;&#x56FE;&#x5F62;" version="1.0.0" inlinePropertyPanel="true"/>
      <scada:props>
        <scada:prop name="displayBody" type="string" label="&#x5C55;&#x793A;&#x5185;&#x5BB9;" default="&#xFF08;&#x672A;&#x7ED1;&#x5B9A;&#x4EA7;&#x54C1;&#x5B57;&#x6BB5;&#xFF09;" domain="observe" semantic="display.content" required="false" bindable="false" controllable="false"/>
        <scada:prop name="fontSize" type="number" label="&#x6807;&#x7B7E;&#x5B57;&#x53F7;" default="12" min="8" max="24" domain="observe" semantic="display.labelFontSize" required="false" bindable="false" controllable="false"/>
        <scada:prop name="fill" type="color" label="&#x6807;&#x7B7E;&#x989C;&#x8272;" default="#1a1a1a" domain="observe" semantic="style.labelFill" required="false" bindable="false" controllable="false"/>
        <scada:prop name="valueFontSize" type="number" label="&#x6570;&#x503C;&#x5B57;&#x53F7;" default="12" min="8" max="24" domain="observe" semantic="display.valueFontSize" required="false" bindable="false" controllable="false"/>
        <scada:prop name="valueFill" type="color" label="&#x6570;&#x503C;&#x989C;&#x8272;" default="#1a1a1a" domain="observe" semantic="style.valueFill" required="false" bindable="false" controllable="false"/>
        <scada:prop name="columns" type="number" label="&#x6BCF;&#x884C;&#x5C5E;&#x6027;&#x6570;" default="1" min="1" max="4" step="1" precision="0" domain="observe" semantic="display.columns" required="false" bindable="false" controllable="false"/>
        <scada:prop name="panelFill" type="color" label="&#x9762;&#x677F;&#x80CC;&#x666F;" default="#f7f9fc" domain="observe" semantic="style.bodyColor" required="false" bindable="false" controllable="false" allowTransparent="true"/>
        <scada:prop name="stroke" type="color" label="&#x8FB9;&#x6846;&#x989C;&#x8272;" default="#d9d9d9" domain="observe" semantic="style.stroke" required="false" bindable="false" controllable="false" allowTransparent="true"/>
        <scada:prop name="strokeWidth" type="number" label="&#x8FB9;&#x6846;&#x5BBD;&#x5EA6;" default="1" min="0" max="10" step="1" precision="0" domain="observe" semantic="style.strokeWidth" required="false" bindable="false" controllable="false"/>
      </scada:props>
      <scada:mappings>
        <scada:map prop="panelFill" selector="#panel-bg" attr="fill"/>
        <scada:map prop="stroke" selector="#panel-bg" attr="stroke"/>
        <scada:map prop="strokeWidth" selector="#panel-bg" attr="stroke-width"/>
      </scada:mappings>
      <scada:animations/>
    </scada:element>
  </metadata>
  <style>
    #panel-text {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: min-content;
      align-content: start;
      column-gap: 12px;
      row-gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: #b8bec8 transparent;
      overscroll-behavior-y: contain;
    }
    #panel-text::-webkit-scrollbar { width: 4px; }
    #panel-text::-webkit-scrollbar-track { background: transparent; }
    #panel-text::-webkit-scrollbar-thumb { background: #b8bec8; border-radius: 4px; }
    .scada-property-panel-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      line-height: 1.5;
    }
    .scada-property-panel-label { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .scada-property-panel-value { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .scada-property-panel-row.is-message .scada-property-panel-value { flex-basis: 100%; }
  </style>
  <rect id="panel-bg" x="1" y="1" width="198" height="118" rx="4" fill="#f7f9fc" stroke="#d9d9d9" stroke-width="1"/>
  <foreignObject x="1" y="1" width="198" height="118">
    <div xmlns="http://www.w3.org/1999/xhtml" id="panel-text" data-scada-wheel-scroll="true" data-preserve-html-text-size="true" style="box-sizing:border-box;width:100%;height:100%;margin:0;padding:8px 10px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:min-content;align-content:start;column-gap:12px;row-gap:4px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;line-height:1.5;font-size:12px;color:#1a1a1a;border-radius:4px;font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;">&#xFF08;&#x672A;&#x7ED1;&#x5B9A;&#x4EA7;&#x54C1;&#x5B57;&#x6BB5;&#xFF09;</div>
  </foreignObject>
</svg>
