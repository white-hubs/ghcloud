<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta version="<%- version %>" />
  <link rel="stylesheet" href="/resource/v1/cube-webgl-sandbox/bootstrap.min.css" />
  <link rel="stylesheet" href="/resource/v1/cube-webgl-sandbox/bootstrap-icons.min.css" />
  <script src="/resource/v1/cube-webgl-sandbox/bootstrap.bundle.min.js"></script>
  <title>WebGL Viewer</title>
  <style>

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      padding: 0;
      margin: 0;
    }

    html {
      box-sizing: border-box;
      background: transparent;
    }
    body{
      background: transparent;
    }
    iframe {
      border: 0;
    }
    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
  </style>
</head>

<body style="background: transparent;">
  <div id="cube-webgl-viewer" style="height: 100%; width: 100%;"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
