<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta version="<%- version %>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>停车场</title>
  <style>

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      padding: 0;
      margin: 0;
    }

    html {
      box-sizing: border-box;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: normal;
    }

    ul {
      list-style: none;
    }

    img,
    video {
      height: auto;
      max-width: 100%;
    }

    iframe {
      border: 0;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
  </style>
</head>

<body>
  <div id="app" style="height: 100%; width: 100%;"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
