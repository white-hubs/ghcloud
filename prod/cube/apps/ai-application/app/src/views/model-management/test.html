<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开河管理平台 - 模型管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .sidebar-active { background-color: #e6f4ff; color: #1677ff; border-right: 3px solid #1677ff; }
        .custom-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-[#0052cc] text-white h-12 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-8">
            <div class="flex items-center space-x-2 font-bold text-lg">
                <div class="bg-white text-[#0052cc] rounded-md p-1 leading-none text-sm">V</div>
                <span>开河管理平台</span>
            </div>
            <nav class="flex space-x-6 text-sm opacity-90">
                <a href="#" class="hover:opacity-100">工作台</a>
                <a href="#" class="hover:opacity-100">运维作业</a>
                <a href="#" class="hover:opacity-100 border-b-2 border-white pb-1">内部管理</a>
                <a href="#" class="hover:opacity-100">系统监管</a>
                <a href="#" class="hover:opacity-100">设备监管</a>
                <a href="#" class="hover:opacity-100">安全监管</a>
                <a href="#" class="hover:opacity-100">肉类滑轨</a>
                <a href="#" class="hover:opacity-100">基础应用</a>
            </nav>
        </div>
        <div class="flex items-center space-x-4 text-sm">
            <span class="bg-blue-400 px-2 py-0.5 rounded text-xs">AI</span>
            <span>访问端 <i class="fa-solid fa-caret-down text-xs"></i></span>
            <i class="fa-solid fa-shirt"></i>
            <i class="fa-regular fa-comment-dots"></i>
            <i class="fa-regular fa-bell"></i>
            <div class="flex items-center space-x-1">
                <img src="https://ui-avatars.com/api/?name=Zhang&background=random" class="w-6 h-6 rounded-full" alt="avatar">
                <span>张三丰 <i class="fa-solid fa-caret-down text-xs"></i></span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-60 bg-white border-r flex flex-col shrink-0">
            <div class="p-4">
                <div class="flex items-center text-gray-500 text-sm mb-4">
                    <i class="fa-solid fa-chevron-down mr-2 text-xs"></i>
                    <i class="fa-regular fa-comment mr-2"></i>
                    <span>AI中心</span>
                </div>
                <div class="space-y-1">
                    <a href="#" class="block py-2 px-8 text-sm hover:bg-gray-50 rounded">开河AI助手</a>
                    <a href="#" class="block py-2 px-8 text-sm sidebar-active rounded">模型管理</a>
                    <a href="#" class="block py-2 px-8 text-sm hover:bg-gray-50 rounded">工作流</a>
                    <div class="flex items-center justify-between py-2 px-8 text-sm hover:bg-gray-50 rounded">
                        <span>智能体管理</span>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                    </div>
                    <div class="flex items-center justify-between py-2 px-8 text-sm hover:bg-gray-50 rounded">
                        <span>插件管理</span>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                    </div>
                    <a href="#" class="block py-2 px-8 text-sm hover:bg-gray-50 rounded">技能管理</a>
                    <a href="#" class="block py-2 px-8 text-sm hover:bg-gray-50 rounded">知识库</a>
                </div>
            </div>
            <div class="mt-auto border-t p-2">
                <button class="w-full py-1 px-4 text-xs text-gray-400 text-left">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </aside>

        <!-- Model Provider List Sidebar (Secondary) -->
        <aside class="w-64 bg-white border-r flex flex-col shrink-0">
            <div class="p-3 border-b">
                <div class="relative">
                    <input type="text" placeholder="搜索" class="w-full bg-gray-100 rounded px-8 py-1.5 text-sm focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto">
                <div class="p-1 space-y-0.5">
                    <div class="flex items-center p-2 bg-gray-100 rounded cursor-pointer">
                        <img src="https://www.deepseek.com/favicon.ico" class="w-4 h-4 mr-2" onerror="this.src='https://via.placeholder.com/16'">
                        <span class="text-sm">深度求索</span>
                    </div>
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70">
                        <i class="fa-solid fa-mountain mr-2 text-blue-500 text-xs"></i>
                        <span class="text-sm">火山引擎</span>
                    </div>
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70">
                        <i class="fa-solid fa-atom mr-2 text-purple-500 text-xs"></i>
                        <span class="text-sm">智谱开放平台</span>
                    </div>
                    <!-- Mock more items -->
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70">
                        <div class="w-4 h-4 rounded-full bg-black text-white text-[10px] flex items-center justify-center mr-2">K</div>
                        <span class="text-sm">月之暗面</span>
                    </div>
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70"><div class="w-4 h-4 bg-gray-200 rounded-full mr-2"></div><span class="text-sm text-gray-500">TokenFlux</span></div>
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70"><div class="w-4 h-4 bg-gray-200 rounded-full mr-2"></div><span class="text-sm text-gray-500">硅基流动</span></div>
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70"><div class="w-4 h-4 bg-gray-200 rounded-full mr-2"></div><span class="text-sm text-gray-500">ocoolAI</span></div>
                    <div class="flex items-center p-2 hover:bg-gray-50 rounded cursor-pointer opacity-70"><div class="w-4 h-4 bg-gray-200 rounded-full mr-2"></div><span class="text-sm text-gray-500">Z.ai</span></div>
                </div>
            </div>
            <div class="p-3 border-t">
                <button class="w-full py-2 border rounded-md text-sm text-gray-600 hover:bg-gray-50">
                    <i class="fa-solid fa-plus mr-1"></i> 添加
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 overflow-y-auto bg-white">
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-base font-medium">深度求索</h2>
                    <div class="w-10 h-5 bg-blue-600 rounded-full relative cursor-pointer">
                        <div class="w-4 h-4 bg-white rounded-full absolute right-0.5 top-0.5"></div>
                    </div>
                </div>

                <!-- Form Section -->
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">API密钥</label>
                        <div class="flex">
                            <input type="text" placeholder="输入API密钥" class="flex-1 border rounded-l px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none">
                            <button class="border border-l-0 rounded-r px-4 py-1.5 text-sm text-gray-600 hover:bg-gray-50">检测</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">API地址</label>
                        <input type="text" placeholder="输入API地址" class="w-full border rounded px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-gray-700">模型</label>
                            <div class="flex space-x-2">
                                <button class="flex items-center px-3 py-1.5 border rounded text-xs hover:bg-gray-50">
                                    <i class="fa-solid fa-cube mr-1 text-gray-400"></i> 获取模型列表
                                </button>
                                <button class="flex items-center px-3 py-1.5 border rounded text-xs hover:bg-gray-50">
                                    <i class="fa-solid fa-plus mr-1 text-gray-400"></i> 添加
                                </button>
                            </div>
                        </div>
                        
                        <!-- Model Card Item -->
                        <div class="border rounded-md">
                            <div class="flex items-center justify-between p-3 bg-gray-50 border-b cursor-pointer">
                                <div class="flex items-center space-x-2">
                                    <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
                                    <span class="text-sm">DeepSeek Chat</span>
                                </div>
                            </div>
                            <div class="p-3 flex items-center justify-between group hover:bg-blue-50 transition-colors">
                                <div class="flex items-center space-x-2">
                                    <img src="https://www.deepseek.com/favicon.ico" class="w-4 h-4" onerror="this.src='https://via.placeholder.com/16'">
                                    <span class="text-sm">DeepSeek Chat</span>
                                </div>
                                <div class="flex items-center space-x-4 opacity-0 group-hover:opacity-100">
                                    <i class="fa-regular fa-pen-to-square text-blue-500 cursor-pointer"></i>
                                    <i class="fa-regular fa-trash-can text-red-500 cursor-pointer"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Overlay (Placeholder for Screenshot 1: DeepSeek Search Model) -->
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg w-[600px] shadow-xl overflow-hidden">
            <div class="flex justify-between items-center px-4 py-3 border-b">
                <span class="font-medium text-sm">深度求索模型</span>
                <i class="fa-solid fa-xmark text-gray-400 cursor-pointer hover:text-gray-600"></i>
            </div>
            <div class="p-4 space-y-4">
                <div class="flex space-x-2">
                    <div class="relative flex-1">
                        <input type="text" placeholder="搜索" class="w-full border rounded px-8 py-1.5 text-sm focus:outline-none">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    </div>
                    <button class="px-2 border rounded hover:bg-gray-50"><i class="fa-solid fa-rotate-right text-gray-400"></i></button>
                </div>
                
                <div class="border rounded-md divide-y">
                    <!-- List Item 1 -->
                    <div class="p-2">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-medium flex items-center"><i class="fa-solid fa-chevron-down mr-2 text-[10px]"></i> DeepSeek Chat</span>
                            <i class="fa-solid fa-plus text-gray-400 cursor-pointer"></i>
                        </div>
                        <div class="flex justify-between items-center px-6 py-2">
                            <span class="text-sm flex items-center">
                                <img src="https://www.deepseek.com/favicon.ico" class="w-3.5 h-3.5 mr-2"> DeepSeek Chat
                            </span>
                            <i class="fa-solid fa-minus text-gray-400 cursor-pointer"></i>
                        </div>
                    </div>
                    <!-- List Item 2 -->
                    <div class="p-2">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-medium flex items-center"><i class="fa-solid fa-chevron-down mr-2 text-[10px]"></i> DeepSeek Reasoner</span>
                            <i class="fa-solid fa-plus text-gray-400 cursor-pointer"></i>
                        </div>
                        <div class="flex justify-between items-center px-6 py-2">
                            <span class="text-sm flex items-center">
                                <img src="https://www.deepseek.com/favicon.ico" class="w-3.5 h-3.5 mr-2"> DeepSeek Reasoner
                            </span>
                            <i class="fa-solid fa-minus text-gray-400 cursor-pointer"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-3 p-4 border-t">
                <button class="px-4 py-1.5 border rounded text-sm hover:bg-gray-50">取消</button>
                <button class="px-4 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">确认</button>
            </div>
        </div>
    </div>

    <!-- Script to toggle visibility if needed -->
    <script>
        // 你可以通过控制上面的 Modal Overlay 的 class (hidden) 来显示或隐藏
        // 例如：document.querySelector('.fixed.inset-0').classList.add('hidden');
    </script>
</body>
</html>
