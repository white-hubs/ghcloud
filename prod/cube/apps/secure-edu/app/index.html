<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta version="<%- version %>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全教育</title>
  <style>
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    .secure-edu-picker{
      width: 100% !important;
    }
    .secure-edu-input-number{
      width: 100% !important;
    }
    .primary-color-before{
      position: relative;
    }
    .primary-color-before::before{
      background-color: var(--secure-edu-primary-color) !important;
      content: '';
      position: absolute;
      top: 50%;
      transform: translate(-10px, -50%);
      width: 3px;
      height: 80%;
    }
    .ant-dropdown-link svg{
      fill: var(--secure-edu-primary-color) !important;
    }
  </style>
</head>

<body>
  <div id="SecureEduAPP" style="height: 100%; width: 100%;"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
