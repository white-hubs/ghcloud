<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>开河AI</title>
  <style>
    :root {
      --ai-assistant-page-bg: #ffffff;
      --ai-assistant-chat-bg: linear-gradient(
        180deg,
        #ffffff 0%,
        #ecf3ff 10%,
        #f7f9fc 52%,
        #ffffff 82%,
        #ffffff 100%
      );
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      padding: 0;
      margin: 0;
    }

    html {
      box-sizing: border-box;
      min-height: 100%;
      background: var(--ai-assistant-page-bg);
    }

    body {
      min-height: 100%;
      background: var(--ai-assistant-page-bg);
      overflow: hidden;
    }

    #app {
      min-height: 100%;
      background: var(--ai-assistant-page-bg);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: normal;
    }

    ul {
      list-style: none;
    }

    img,
    video {
      height: auto;
      max-width: 100%;
    }

    iframe {
      border: 0;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
    }

    .color-normal {
      color: var(--van-success-color);
    }

    .color-high {
      color: var(--van-danger-color);
    }

    .color-low {
      color: var(--van-warning-color);
    }

    .bg-normal {
      background-color: var(--van-success-color);
    }

    .bg-high {
      background-color: var(--van-danger-color);
    }

    .bg-low {
      background-color: var(--van-warning-color);
    }

    .after-normal::after {
      background-color: var(--van-success-color);
    }

    .after-high::after {
      background-color: var(--van-danger-color);
    }

    .after-low::after {
      background-color: var(--van-warning-color);
    }
  </style>
</head>

<body>
  <div id="app" style="height: 100%; width: 100%;"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
