<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta version="<%- version %>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子导览</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    .amap-marker-label {
      border: 0;
      background-color: transparent;
    }

    .point-marker {
      padding: 4px 7px;
      font-size: 16px;
      position: relative;
      background: #fff;
      box-shadow: 0px 0px 4px 0px rgba(0, 0, 0, 0.25);
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .point-marker span {
      width: max-content;
    }

    .point-marker::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -5px;
      margin-left: -6px;
      width: 0;
      height: 0;
      border-top: 6px solid #fff;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }

    .point-marker img {
      margin-right: 4px;
    }

    .info {
      background: #fff;
      padding: 12px;
    }
  </style>
</head>

<body>
  <div id="electronic-guide-client" style="height: 100%; width: 100%;"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
