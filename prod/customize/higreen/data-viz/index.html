<!DOCTYPE html>
<html lang="en">

<head>

  <title>光明海吉星运营大屏</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: inherit;
      padding: 0;

      background: transparent;
    }

    body {
      font-family:'YouSheBiaoTiHei';
      background-image: url("/images/background.webp");
      background-size: cover;
    }

    iframe {
      border: 0;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
    }

    @font-face {
      font-family: YouSheBiaoTiHei;
      src: url("/fonts/you-she-biao-ti-hei.ttf")
    }

  </style>
</head>
